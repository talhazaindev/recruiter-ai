services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - ../.env.example
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
      - minio

  parse_worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: python workers/parse_worker.py
    env_file:
      - ../.env.example
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - mongo
      - redis
      - minio
      - api

  match_worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: python workers/match_worker.py
    env_file:
      - ../.env.example
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - mongo
      - redis
      - api

  ingest_worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: python workers/ingest_worker.py
    env_file:
      - ../.env.example
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - mongo
      - redis
      - minio
      - api

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo_data:
  minio_data:
